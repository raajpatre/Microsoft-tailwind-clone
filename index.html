<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Microsoft - Cloud, Computers, Apps &amp; Gaming</title>
  </head>
  <body>
    <div class="container md:mx-auto">

      <div class="navbar flex justify-between items-center p-4">
        <div class="flex items-center justify-center md:order-2">
          <div class="hamburger inline-block p-4 cursor-pointer md:hidden">
            <div class="line h-0.5 w-6 my-1 bg-black"></div>
            <div class="line h-0.5 w-6 my-1 bg-black"></div>
            <div class="line h-0.5 w-6 my-1 bg-black"></div>
          </div>
          <div class="search md:hidden w-6 mr-4"><img src="search.svg" alt=""></div>
        </div>
        <div class="logo flex text-center md:order-1">
          <div class="p-4 flex justify-center"><img class="w-[50%]" src="RE1Mu3b.png" alt=""></div>
          <div class="features absolute inset-0 md:static  bg-gray-200 md:w-auto md:bg-white md:flex md:items-center md:mx-4 md:space-x-6 -translate-x-96 w-fit md:translate-x-0">
            <div class="hover:underline hover:cursor-pointer">Microsoft 365</div>
            <div class="hover:underline hover:cursor-pointer">Office</div>
            <div class="hover:underline hover:cursor-pointer">Windows</div>
            <div class="hover:underline hover:cursor-pointer">Surface</div>
            <div class="hover:underline hover:cursor-pointer">Xbox</div>
            <div class="hover:underline hover:cursor-pointer">Support</div>
          </div>
        </div>
        <div class="cart text-center md:order-3 flex">
          <div class="search hidden md:block mr-6 hover:underline hover:cursor-pointer">All Microsoft ^</div>
          <div class="mx-2">Search</div><img class="w-6 mr-6" src="search.svg" alt="">
          <img class="w-6 mr-4" src="cart.svg" alt="">
          <div class="mx-2">Sign-in</div>
          <img class="w-6 mr-4" src="person-circle.svg" alt="">
        </div>
      </div>
      <div class="slider flex flex-col-reverse md:flex-row bg-[#f2f2f2]">
        <div class="left flex flex-col justify-center items-center md:items-baseline py-12 md:ml-32">
          <h1 class="text-2xl md:text-4xl font-medium mx-5">Surface laptop 4</h1>
          <p class="w-3/4 mx-5 text-center md:text-left" >Do it all with a perfect balance sheet of sleek, ultra-thin design, multitasking speed and improved performance</p>
          <button class="text-white bg-black px-4 py-2 my-6 font-bold mx-5">Shop Now ></button>
        </div>
        <div class="right ">
          <img class="w-[60rem] md:w-[64rem]" src="Screenshot 2025-11-13 at 7.48.54 PM.png" alt="">
        </div>
      </div>
      <div class="promo space-y-6 flex flex-col justify-center pt-6 md:flex-row">
        <div class="item flex mx-4 items-center md:flex-col space-x-2 ">
          <img class="w-14 md:h-8" src="Link-List-Icons-Microsoft-365.png" alt="">
          <span class="font-medium">Choose your Microsoft 365</span>
        </div>
         <div class="item flex mx-4 items-center md:flex-col space-x-2">
          <img class="w-14 md:h-8" src="Link-List-Icons-Surface-Devices.png" alt="">
          <span class="font-medium">Explore Surface devices</span>
        </div>
         <div class="item flex mx-4 items-center md:flex-col space-x-2">
          <img class="w-14 md:h-8" src="Link-List-Icons-Xbox-Games-Consoles.png" alt="">
          <span class="font-medium">Buy Xbox Games</span>
        </div>
        <div class="item flex mx-4 items-center md:flex-col space-x-2 ">
          <img class="w-14 md:h-8" src="Link-List-Icons-Microsoft-365.png" alt="">
          <span class="font-medium">Get Windows 11</span>
        </div>
      </div>
      </div>
    </div>
    </body>
    </html>
